<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拼豆產生器</title><style>body{font-family:system-ui,sans-serif;background:#f3f7fc;color:#18334f;margin:0}header{background:#174b7c;color:white;padding:20px;font-size:24px;font-weight:bold}main{max-width:1200px;margin:20px auto;display:grid;grid-template-columns:300px 1fr;gap:16px;padding:0 12px}section{background:white;border-radius:15px;padding:20px;box-shadow:0 3px 16px #18334f18}label{display:block;margin:15px 0 5px;font-weight:600}select,input,button{box-sizing:border-box;width:100%;padding:9px;border-radius:8px;border:1px solid #ccd8e4}button{background:#1472b8;color:white;border:0;margin-top:10px;font-weight:bold;cursor:pointer}canvas{width:100%;height:auto}small{color:#63778b}#legend{display:flex;flex-wrap:wrap;gap:9px}#legend span{padding:7px;border:1px solid #ddd;border-radius:8px;font-size:13px}.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:5px;border:1px solid #999}@media(max-width:750px){main{grid-template-columns:1fr}}@media print{header,.controls{display:none}main{display:block}section{box-shadow:none}}</style><header>🧩 Perler Studio v2.0｜主體去背版</header><main><section class="controls"><h3>上傳與設定</h3><label>選擇圖片</label><input type="file" id="file" accept="image/*"><label>拼豆板尺寸</label><select id="size"><option>10</option><option>15</option><option>20</option><option selected>21</option><option>25</option><option>30</option><option>40</option><option value="custom">自訂</option></select><label>寬度（顆）</label><input type="number" id="w" value="21" min="5" max="100"><label>高度（顆）</label><input type="number" id="h" value="21" min="5" max="100"><label>最多使用顏色：<b id="num">6</b></label><input type="range" id="colors" min="2" max="16" value="6"><label>背景處理</label><select id="bg"><option value="transparent">透明背景（只拼主體）</option><option value="white">移除白色背景</option><option value="keep">保留全部背景</option></select><label>自動去背容差 <b id="tolnum">40</b></label><input type="range" id="tolerance" min="5" max="140" value="40"><button id="auto">自動去背（從四邊移除背景）</button><button id="reset">重設去背</button><label>手動去背（在下方照片塗抹）</label><select id="masktool"><option value="erase">擦除背景</option><option value="restore">恢復主體</option></select><label>筆刷大小 <b id="brushnum">30</b></label><input id="brush" type="range" min="5" max="100" value="30"><canvas id="maskview" style="border:1px solid #ccd8e4;background:repeating-conic-gradient(#eee 0 25%,white 0 50%) 50%/20px 20px;touch-action:none" width="300" height="200"></canvas><p><small>先去背，再按「產生拼豆圖」。深色 UFO 和夜空相近，需手動擦除背景。</small></p><label>圖片縮放</label><select id="fit"><option value="contain">保留完整圖片</option><option value="cover">填滿圖紙</option></select><button id="make">產生拼豆圖</button><h3>手動編輯</h3><label>點選圖紙操作</label><select id="tool"><option value="erase">橡皮擦</option><option value="paint">畫筆</option></select><label>畫筆顏色</label><input type="color" id="paint" value="#315c9b"><button id="undo">復原</button><h3>匯出</h3><button id="png">下載 PNG</button><button id="csv">下載 CSV 顏色矩陣</button><button id="print">列印 / 儲存 PDF</button><p><small>每格一顆圓形拼豆。圖片只在本機瀏覽器處理；顏色為自動近似色，尚非品牌官方色號。</small></p></section><section><h3 id="title">21 × 21 拼豆圖紙</h3><canvas id="canvas"></canvas><h3 id="total"></h3><div id="legend"></div></section></main><script>
const $=id=>document.getElementById(id),cv=$('canvas'),cx=cv.getContext('2d');let img=null,grid=[],hist=[],original=null,mask=null,maskDraw=false,lastMask=null;const mv=$('maskview'),mx=mv.getContext('2d',{willReadFrequently:true});const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),hex=p=>'#'+p.map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''),d=(a,b)=>a.reduce((s,v,i)=>s+(v-b[i])**2,0),dims=()=>[Math.max(5,Math.min(100,+$('w').value||21)),Math.max(5,Math.min(100,+$('h').value||21))];
$('size').onchange=()=>{if($('size').value!=='custom')$('w').value=$('h').value=$('size').value;make()};$('w').onchange=$('h').onchange=()=>{$('size').value='custom';make()};$('colors').oninput=()=>{$('num').textContent=$('colors').value};$('colors').onchange=$('bg').onchange=$('fit').onchange=make;$('make').onclick=make;$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;let url=URL.createObjectURL(f),i=new Image();i.onload=()=>{img=i;let sc=Math.min(1,500/Math.max(i.width,i.height));mv.width=Math.round(i.width*sc);mv.height=Math.round(i.height*sc);mx.drawImage(i,0,0,mv.width,mv.height);original=mx.getImageData(0,0,mv.width,mv.height);mask=new Uint8Array(mv.width*mv.height).fill(255);showMask();make();URL.revokeObjectURL(url)};i.src=url};
function showMask(){if(!original)return;let data=new Uint8ClampedArray(original.data);for(let i=0;i<mask.length;i++)data[4*i+3]=mask[i];mx.putImageData(new ImageData(data,mv.width,mv.height),0,0)}
function removeBg(){if(!original)return;let w=mv.width,h=mv.height,d=original.data,t=+$('tolerance').value,colors=[];for(let x=0;x<w;x+=Math.max(1,Math.floor(w/20)))for(let y of [0,h-1]){let i=(y*w+x)*4;colors.push([d[i],d[i+1],d[i+2]])}for(let y=0;y<h;y+=Math.max(1,Math.floor(h/20)))for(let x of [0,w-1]){let i=(y*w+x)*4;colors.push([d[i],d[i+1],d[i+2]])}let buckets=new Map();for(let c of colors){let k=c.map(v=>Math.floor(v/24)).join(',');buckets.set(k,(buckets.get(k)||0)+1)}let base=[...buckets].sort((a,b)=>b[1]-a[1])[0][0].split(',').map(v=>(+v+.5)*24);let seen=new Uint8Array(w*h),q=new Int32Array(w*h),head=0,tail=0;function add(i){if(seen[i])return;let p=4*i;if(Math.hypot(d[p]-base[0],d[p+1]-base[1],d[p+2]-base[2])>t)return;seen[i]=1;q[tail++]=i}for(let x=0;x<w;x++){add(x);add((h-1)*w+x)}for(let y=0;y<h;y++){add(y*w);add(y*w+w-1)}while(head<tail){let i=q[head++],x=i%w,y=Math.floor(i/w);if(x)add(i-1);if(x<w-1)add(i+1);if(y)add(i-w);if(y<h-1)add(i+w)}for(let i=0;i<mask.length;i++)mask[i]=seen[i]?0:255;showMask();make()}
$('auto').onclick=removeBg;$('reset').onclick=()=>{if(mask){mask.fill(255);showMask();make()}};$('tolerance').oninput=()=>$('tolnum').textContent=$('tolerance').value;$('brush').oninput=()=>$('brushnum').textContent=$('brush').value;
function brushMask(e){let r=mv.getBoundingClientRect(),x=(e.clientX-r.left)*mv.width/r.width,y=(e.clientY-r.top)*mv.height/r.height,rad=+$('brush').value/2,steps=lastMask?Math.max(1,Math.ceil(Math.hypot(x-lastMask.x,y-lastMask.y)/Math.max(1,rad/3))):1;for(let st=0;st<=steps;st++){let px=lastMask?lastMask.x+(x-lastMask.x)*st/steps:x,py=lastMask?lastMask.y+(y-lastMask.y)*st/steps:y;for(let yy=Math.max(0,Math.floor(py-rad));yy<Math.min(mv.height,Math.ceil(py+rad));yy++)for(let xx=Math.max(0,Math.floor(px-rad));xx<Math.min(mv.width,Math.ceil(px+rad));xx++)if((xx-px)**2+(yy-py)**2<=rad*rad)mask[yy*mv.width+xx]=$('masktool').value==='erase'?0:255}lastMask={x,y};showMask()}
mv.onpointerdown=e=>{if(!mask)return;maskDraw=true;lastMask=null;mv.setPointerCapture(e.pointerId);brushMask(e)};mv.onpointermove=e=>{if(maskDraw)brushMask(e)};mv.onpointerup=mv.onpointercancel=()=>{maskDraw=false;lastMask=null};

function make(){let [w,h]=dims();$('title').textContent=`${w} × ${h} 拼豆圖紙`;hist=[];if(!img){grid=Array.from({length:h},()=>Array(w).fill(null));draw();return}let c=document.createElement('canvas');c.width=w;c.height=h;let g=c.getContext('2d');let raw=[];if(original&&$('bg').value==='transparent'){let sw=mv.width,sh=mv.height,x0=sw,y0=sh,x1=-1,y1=-1;for(let yy=0;yy<sh;yy++)for(let xx=0;xx<sw;xx++)if(mask[yy*sw+xx]>100){x0=Math.min(x0,xx);y0=Math.min(y0,yy);x1=Math.max(x1,xx);y1=Math.max(y1,yy)}if(x1<0){grid=Array.from({length:h},()=>Array(w).fill(null));draw();return}let bw=x1-x0+1,bh=y1-y0+1,scale=Math.min(w*.9/bw,h*.9/bh),dw=bw*scale,dh=bh*scale,ox=(w-dw)/2,oy=(h-dh)/2;for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){let sx=x0+(xx+.5-ox)/scale,sy=y0+(yy+.5-oy)/scale,ix=Math.floor(sx),iy=Math.floor(sy);if(ix<0||iy<0||ix>=sw||iy>=sh||mask[iy*sw+ix]<100){raw.push(null);continue}let i=(iy*sw+ix)*4;raw.push([original.data[i],original.data[i+1],original.data[i+2]])}}else{let scale=$('fit').value==='cover'?Math.max(w/img.width,h/img.height):Math.min(w/img.width,h/img.height);g.drawImage(img,(w-img.width*scale)/2,(h-img.height*scale)/2,img.width*scale,img.height*scale);let data=g.getImageData(0,0,w,h).data;for(let i=0;i<w*h;i++){let p=[data[i*4],data[i*4+1],data[i*4+2]];raw.push(data[i*4+3]<128||($('bg').value==='white'&&Math.min(...p)>235)?null:p)}}let counts=new Map();for(let p of raw)if(p){let q=p.map(v=>Math.min(255,Math.round(v/32)*32)),k=q.join(',');counts.set(k,(counts.get(k)||0)+1)}let sorted=[...counts].sort((a,b)=>b[1]-a[1]);if(!sorted.length){grid=Array.from({length:h},()=>Array(w).fill(null));draw();return}let pal=sorted.length?[sorted[0][0].split(',').map(Number)]:[];while(pal.length<Math.min(+$('colors').value,sorted.length)){let best=null,score=-1;for(let [k,n] of sorted){let p=k.split(',').map(Number),v=Math.min(...pal.map(t=>d(p,t)))*Math.sqrt(n);if(v>score){score=v;best=p}}if(!best||pal.some(p=>p.join()==best.join()))break;pal.push(best)}grid=Array.from({length:h},(_,y)=>Array.from({length:w},(_,x)=>{let p=raw[y*w+x];if(!p)return null;return pal.reduce((a,b)=>d(p,a)<d(p,b)?a:b)}));draw()}
function draw(){let [w,h]=dims(),cell=Math.max(18,Math.floor(760/Math.max(w,h))),pad=35;cv.width=w*cell+pad*2;cv.height=h*cell+pad*2;cx.fillStyle='white';cx.fillRect(0,0,cv.width,cv.height);cx.textAlign='center';cx.textBaseline='middle';cx.font='12px sans-serif';let counts=new Map();for(let y=0;y<h;y++)for(let x=0;x<w;x++){let p=grid[y]?.[x],px=pad+x*cell+cell/2,py=pad+y*cell+cell/2;if(p){let k=hex(p);counts.set(k,(counts.get(k)||0)+1)}cx.strokeStyle='#dbe2e9';cx.strokeRect(pad+x*cell,pad+y*cell,cell,cell);cx.fillStyle=p?hex(p):'white';cx.beginPath();cx.arc(px,py,cell*.38,0,Math.PI*2);cx.fill();cx.strokeStyle='#a6b0bd';cx.stroke();if(p){cx.fillStyle='#ffffff99';cx.beginPath();cx.arc(px,py,cell*.07,0,Math.PI*2);cx.fill()}}cx.fillStyle='#334155';for(let x=0;x<w;x++)cx.fillText(x+1,pad+x*cell+cell/2,18);for(let y=0;y<h;y++)cx.fillText(y+1,18,pad+y*cell+cell/2);let total=[...counts.values()].reduce((a,b)=>a+b,0);$('total').textContent=`共 ${total} 顆，${counts.size} 種顏色`;$('legend').innerHTML=[...counts].sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<span><i class="dot" style="background:${k}"></i>${k.toUpperCase()}：${n} 顆</span>`).join('')}
cv.onclick=e=>{let r=cv.getBoundingClientRect(),[w,h]=dims(),cell=(cv.width-70)/w,x=Math.floor(((e.clientX-r.left)*cv.width/r.width-35)/cell),y=Math.floor(((e.clientY-r.top)*cv.height/r.height-35)/cell);if(x<0||y<0||x>=w||y>=h)return;hist.push(grid.map(row=>row.map(p=>p&&[...p])));grid[y][x]=$('tool').value==='erase'?null:rgb($('paint').value);draw()};$('undo').onclick=()=>{if(hist.length){grid=hist.pop();draw()}};$('png').onclick=()=>{let a=document.createElement('a');a.download=`拼豆_${dims().join('x')}.png`;a.href=cv.toDataURL();a.click()};$('csv').onclick=()=>{let s=grid.map(row=>row.map(p=>p?hex(p):'').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download='拼豆顏色矩陣.csv';a.click()};$('print').onclick=()=>window.print();make();
</script></html>
