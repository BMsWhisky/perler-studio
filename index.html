<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拼豆產生器</title><style>body{font-family:system-ui,sans-serif;background:#f3f7fc;color:#18334f;margin:0}header{background:#174b7c;color:white;padding:20px;font-size:24px;font-weight:bold}main{max-width:1200px;margin:20px auto;display:grid;grid-template-columns:300px 1fr;gap:16px;padding:0 12px}section{background:white;border-radius:15px;padding:20px;box-shadow:0 3px 16px #18334f18}label{display:block;margin:15px 0 5px;font-weight:600}select,input,button{box-sizing:border-box;width:100%;padding:9px;border-radius:8px;border:1px solid #ccd8e4}button{background:#1472b8;color:white;border:0;margin-top:10px;font-weight:bold;cursor:pointer}canvas{width:100%;height:auto}small{color:#63778b}#legend{display:flex;flex-wrap:wrap;gap:9px}#legend span{padding:7px;border:1px solid #ddd;border-radius:8px;font-size:13px}.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:5px;border:1px solid #999}@media(max-width:750px){main{grid-template-columns:1fr}}@media print{header,.controls{display:none}main{display:block}section{box-shadow:none}}</style><header>🧩 拼豆圖紙產生器</header><main><section class="controls"><h3>上傳與設定</h3><label>選擇圖片</label><input type="file" id="file" accept="image/*"><label>拼豆板尺寸</label><select id="size"><option>10</option><option>15</option><option>20</option><option selected>21</option><option>25</option><option>30</option><option>40</option><option value="custom">自訂</option></select><label>寬度（顆）</label><input type="number" id="w" value="21" min="5" max="100"><label>高度（顆）</label><input type="number" id="h" value="21" min="5" max="100"><label>最多使用顏色：<b id="num">6</b></label><input type="range" id="colors" min="2" max="16" value="6"><label>背景處理</label><select id="bg"><option value="white">白色背景不放豆</option><option value="keep">保留背景</option></select><label>圖片縮放</label><select id="fit"><option value="contain">保留完整圖片</option><option value="cover">填滿圖紙</option></select><button id="make">產生拼豆圖</button><h3>手動編輯</h3><label>點選圖紙操作</label><select id="tool"><option value="erase">橡皮擦</option><option value="paint">畫筆</option></select><label>畫筆顏色</label><input type="color" id="paint" value="#315c9b"><button id="undo">復原</button><h3>匯出</h3><button id="png">下載 PNG</button><button id="csv">下載 CSV 顏色矩陣</button><button id="print">列印 / 儲存 PDF</button><p><small>每格一顆圓形拼豆。圖片只在本機瀏覽器處理；顏色為自動近似色，尚非品牌官方色號。</small></p></section><section><h3 id="title">21 × 21 拼豆圖紙</h3><canvas id="canvas"></canvas><h3 id="total"></h3><div id="legend"></div></section></main><script>
const $=id=>document.getElementById(id),cv=$('canvas'),cx=cv.getContext('2d');let img=null,grid=[],hist=[];const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),hex=p=>'#'+p.map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''),d=(a,b)=>a.reduce((s,v,i)=>s+(v-b[i])**2,0),dims=()=>[Math.max(5,Math.min(100,+$('w').value||21)),Math.max(5,Math.min(100,+$('h').value||21))];
$('size').onchange=()=>{if($('size').value!=='custom')$('w').value=$('h').value=$('size').value;make()};$('w').onchange=$('h').onchange=()=>{$('size').value='custom';make()};$('colors').oninput=()=>{$('num').textContent=$('colors').value};$('colors').onchange=$('bg').onchange=$('fit').onchange=make;$('make').onclick=make;$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;let url=URL.createObjectURL(f),i=new Image();i.onload=()=>{img=i;make();URL.revokeObjectURL(url)};i.src=url};
function make(){let [w,h]=dims();$('title').textContent=`${w} × ${h} 拼豆圖紙`;hist=[];if(!img){grid=Array.from({length:h},(_,y)=>Array.from({length:w},(_,x)=>{let dx=(x-w/2)/(w*.4),dy=(y-h/2)/(h*.4);return dx*dx+dy*dy<1?[44,116,185]:null}));draw();return}let c=document.createElement('canvas');c.width=w;c.height=h;let g=c.getContext('2d');let s=$('fit').value==='cover'?Math.max(w/img.width,h/img.height):Math.min(w/img.width,h/img.height);g.drawImage(img,(w-img.width*s)/2,(h-img.height*s)/2,img.width*s,img.height*s);let data=g.getImageData(0,0,w,h).data,raw=[];for(let i=0;i<w*h;i++){let p=[data[i*4],data[i*4+1],data[i*4+2]];raw.push(data[i*4+3]<128||($('bg').value==='white'&&Math.min(...p)>235)?null:p)}let counts=new Map();for(let p of raw)if(p){let q=p.map(v=>Math.min(255,Math.round(v/32)*32)),k=q.join(',');counts.set(k,(counts.get(k)||0)+1)}let sorted=[...counts].sort((a,b)=>b[1]-a[1]),pal=sorted.length?[sorted[0][0].split(',').map(Number)]:[];while(pal.length<Math.min(+$('colors').value,sorted.length)){let best=null,score=-1;for(let [k,n] of sorted){let p=k.split(',').map(Number),v=Math.min(...pal.map(t=>d(p,t)))*Math.sqrt(n);if(v>score){score=v;best=p}}if(!best||pal.some(p=>p.join()==best.join()))break;pal.push(best)}grid=Array.from({length:h},(_,y)=>Array.from({length:w},(_,x)=>{let p=raw[y*w+x];if(!p)return null;return pal.reduce((a,b)=>d(p,a)<d(p,b)?a:b)}));draw()}
function draw(){let [w,h]=dims(),cell=Math.max(18,Math.floor(760/Math.max(w,h))),pad=35;cv.width=w*cell+pad*2;cv.height=h*cell+pad*2;cx.fillStyle='white';cx.fillRect(0,0,cv.width,cv.height);cx.textAlign='center';cx.textBaseline='middle';cx.font='12px sans-serif';let counts=new Map();for(let y=0;y<h;y++)for(let x=0;x<w;x++){let p=grid[y]?.[x],px=pad+x*cell+cell/2,py=pad+y*cell+cell/2;if(p){let k=hex(p);counts.set(k,(counts.get(k)||0)+1)}cx.strokeStyle='#dbe2e9';cx.strokeRect(pad+x*cell,pad+y*cell,cell,cell);cx.fillStyle=p?hex(p):'white';cx.beginPath();cx.arc(px,py,cell*.38,0,Math.PI*2);cx.fill();cx.strokeStyle='#a6b0bd';cx.stroke();if(p){cx.fillStyle='#ffffff99';cx.beginPath();cx.arc(px,py,cell*.07,0,Math.PI*2);cx.fill()}}cx.fillStyle='#334155';for(let x=0;x<w;x++)cx.fillText(x+1,pad+x*cell+cell/2,18);for(let y=0;y<h;y++)cx.fillText(y+1,18,pad+y*cell+cell/2);let total=[...counts.values()].reduce((a,b)=>a+b,0);$('total').textContent=`共 ${total} 顆，${counts.size} 種顏色`;$('legend').innerHTML=[...counts].sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<span><i class="dot" style="background:${k}"></i>${k.toUpperCase()}：${n} 顆</span>`).join('')}
cv.onclick=e=>{let r=cv.getBoundingClientRect(),[w,h]=dims(),cell=(cv.width-70)/w,x=Math.floor(((e.clientX-r.left)*cv.width/r.width-35)/cell),y=Math.floor(((e.clientY-r.top)*cv.height/r.height-35)/cell);if(x<0||y<0||x>=w||y>=h)return;hist.push(grid.map(row=>row.map(p=>p&&[...p])));grid[y][x]=$('tool').value==='erase'?null:rgb($('paint').value);draw()};$('undo').onclick=()=>{if(hist.length){grid=hist.pop();draw()}};$('png').onclick=()=>{let a=document.createElement('a');a.download=`拼豆_${dims().join('x')}.png`;a.href=cv.toDataURL();a.click()};$('csv').onclick=()=>{let s=grid.map(row=>row.map(p=>p?hex(p):'').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download='拼豆顏色矩陣.csv';a.click()};$('print').onclick=()=>window.print();make();
</script></html>
